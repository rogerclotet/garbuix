stages:
  - check
  - deploy

sast:
  stage: check

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"

secret_detection:
  stage: check

lint:
  stage: check
  image: node:25.2-slim
  before_script:
    - npm install -g pnpm@latest-10
    - pnpm install
  script:
    - pnpm lint
    - pnpm check
    - pnpm typecheck
  artifacts:
    paths:
      - node_modules
      - test-report.xml
    reports:
      junit: test-report.xml

deploy:
  stage: deploy
  image: alpine
  before_script:
    - apk add openssh-client sshpass
  script:
    - chmod +x scripts/deploy.sh
    - scripts/deploy.sh
  only:
    - main
