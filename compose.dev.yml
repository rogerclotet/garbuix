services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--save",
        "300 1",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      target: dev
    image: paraules-app:dev
    command:
      [
        "sh",
        "-lc",
        "pnpm install --frozen-lockfile && pnpm exec tsx scripts/download-catalan-dictionary.ts --if-missing && pnpm db:migrate && pnpm dev --host 0.0.0.0 --port 3000",
      ]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DOCKER_DEV: "true"
      NODE_ENV: development
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_HOST: "${VITE_HMR_HOST:-localhost}"
      VITE_HMR_CLIENT_PORT: "${APP_PORT:-3000}"
      VITE_HMR_PROTOCOL: "${VITE_HMR_PROTOCOL:-ws}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-paraules}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-dev-secret-change-me-please-replace-1234}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      POSTHOG_KEY: "${POSTHOG_KEY:-}"
      POSTHOG_HOST: "${POSTHOG_HOST:-}"
      POSTHOG_UI_HOST: "${POSTHOG_UI_HOST:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store

  # The clue pre-generator calls the Anthropic API; keep it off by default in
  # local dev. It stays profile-less in compose.yml, so production still runs it.
  pre-generator:
    profiles: ["scheduler"]

  backfill:
    build:
      context: .
      target: dev
    image: paraules-app:dev
    command:
      ["sh", "-lc", "pnpm install --frozen-lockfile && pnpm exec tsx scripts/download-catalan-dictionary.ts --if-missing && pnpm backfill:puzzles"]
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-paraules}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-dev-secret-change-me-please-replace-1234}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      POSTHOG_KEY: "${POSTHOG_KEY:-}"
      POSTHOG_HOST: "${POSTHOG_HOST:-}"
      POSTHOG_UI_HOST: "${POSTHOG_UI_HOST:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store

volumes:
  app_node_modules:
  pnpm_store:
  redis_data:
