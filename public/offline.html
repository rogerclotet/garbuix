<!doctype html>
<html lang="ca">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2a7d6e" />
		<title>Garbuix!</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					"Nunito Variable",
					system-ui,
					sans-serif;
				background: #faf8f5;
				color: #2c2825;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				background:
					radial-gradient(circle at top, rgba(42, 125, 110, 0.14), transparent 42%),
					#faf8f5;
			}

			main {
				max-width: 420px;
				padding: 28px 24px;
				border: 1px solid #ddd6cc;
				border-radius: 24px;
				background: rgba(250, 248, 245, 0.92);
				box-shadow: 0 16px 40px rgba(44, 40, 37, 0.08);
			}

			h1 {
				margin: 0 0 12px;
				font-size: 1.5rem;
				line-height: 1.2;
			}

			p {
				margin: 0;
				line-height: 1.5;
				color: #7a7168;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					background: #1c1a17;
					color: #e5e0d8;
				}

				body {
					background:
						radial-gradient(
							circle at top,
							rgba(94, 196, 176, 0.18),
							transparent 42%
						),
						#1c1a17;
				}

				main {
					border-color: #3a352e;
					background: rgba(28, 26, 23, 0.92);
					box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
				}

				p {
					color: #a89e93;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Sense connexió</h1>
			<p>Torna a obrir Garbuix! quan recuperis internet per continuar jugant.</p>
		</main>
	</body>
</html>
