name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: node:25.2-slim
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: garbuix_test
        options: >-
          --health-cmd "pg_isready -U test -d garbuix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@postgres:5432/garbuix_test
      TEST_REDIS_URL: redis://redis:6379
    steps:
      - uses: actions/checkout@v7

      - name: Install unzip
        run: apt-get update && apt-get install -y unzip

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm download-dict
      - run: pnpm typecheck
      - name: Run test suite
        run: pnpm test

  migrations:
    # Deploys migrate while the previous release still serves. Fail before
    # anything is published when a new migration would break that release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check compares against the previous release's commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Check new migrations against the previous release
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSHED_OVER: ${{ github.event.before }}
        run: |
          base="$PULL_REQUEST_BASE"
          if [ -z "$base" ]; then
            # On main the previous release is what production serves. That is
            # older than the previous commit when a deploy failed or was
            # cancelled for a newer one.
            release="$(curl -fsS --max-time 10 https://garbuix.app/version.json | jq -r '.sentryRelease // empty')" || release=""
            base="${release#garbuix@}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::warning::Could not read the serving release; comparing with the previous commit instead"
              base="$PUSHED_OVER"
            fi
          fi
          node scripts/check-migrations.ts "$base"

  publish:
    needs: [lint, migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Building on the production server competed with the live app for CPU and
    # memory for minutes on every deploy. Build here; the server only pulls.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app-image: ${{ steps.images.outputs.app }}
      scheduler-image: ${{ steps.images.outputs.scheduler }}
    steps:
      - uses: actions/checkout@v7

      # The browser DSN is compiled into the bundle and its CSP. Building
      # without it would silently ship a release that reports no errors.
      - name: Check build configuration
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "::error::Set the VITE_SENTRY_DSN repository variable"
            exit 1
          fi
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set; source maps will not be uploaded"
          fi

      - name: Name images
        id: images
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "release=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "app=$repository/app:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "scheduler=$repository/scheduler:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.images.outputs.app }}
          build-args: |
            SENTRY_RELEASE=${{ steps.images.outputs.release }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=production-images

      # Reuses the app build from the builder cache, so the bundle and its
      # uploaded source maps are produced once per release.
      - name: Build and push scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: scheduler
          push: true
          tags: ${{ steps.images.outputs.scheduler }}
          build-args: |
            SENTRY_RELEASE=${{ steps.images.outputs.release }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=production-images
          cache-to: type=gha,scope=production-images,mode=max

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Every deploy mutates the same checkout, images, and Compose project, and
    # picks the idle app color from the proxy's state. Finish the active deploy
    # before another job can replace its containers.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: alpine
    steps:
      - uses: actions/checkout@v7

      - name: Install SSH client
        run: apk add --no-cache openssh-client sshpass

      - run: chmod +x scripts/deploy.sh
      - run: scripts/deploy.sh
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PROJECT_DIRECTORY: ${{ secrets.SSH_PROJECT_DIRECTORY }}
          PORT: ${{ secrets.PORT }}
          APP_IMAGE: ${{ needs.publish.outputs.app-image }}
          SCHEDULER_IMAGE: ${{ needs.publish.outputs.scheduler-image }}
          # Expires when this job ends, so the server keeps no registry login.
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
