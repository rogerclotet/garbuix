name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: node:25.2-slim
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: garbuix_test
        options: >-
          --health-cmd "pg_isready -U test -d garbuix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@postgres:5432/garbuix_test
    steps:
      - uses: actions/checkout@v7

      - name: Install unzip
        run: apt-get update && apt-get install -y unzip

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm download-dict
      - run: pnpm typecheck
      - name: Run test suite
        run: pnpm test

  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: alpine
    steps:
      - uses: actions/checkout@v7

      - name: Install SSH client
        run: apk add --no-cache openssh-client sshpass

      - run: chmod +x scripts/deploy.sh
      - run: scripts/deploy.sh
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PROJECT_DIRECTORY: ${{ secrets.SSH_PROJECT_DIRECTORY }}
          PORT: ${{ secrets.PORT }}
